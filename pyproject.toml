[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handover-relay-decay"
version = "0.1.0"
description = "Multi-shift handover relay simulation: measures critical-item survival half-life per compression and repair policy on seeded synthetic data."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Amna Raheeba"}]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
